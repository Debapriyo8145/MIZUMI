
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | MIZUMI Aquatics</title>

    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"> -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/auth.js" defer></script>
</head>

<body class="login-page">

    <main class="login-layout">

        <section class="login-visual">
            <div class="visual-overlay"></div>

            <div class="visual-content">
                <a href="index.html" class="brand" aria-label="MIZUMI Aquatics home">
                <img
                    src="../backend/img/logo/mizumi-logo-white.svg"
                    alt="MIZUMI Aquatics"
                    class="brand-logo"
                >
            </a>

                <div class="visual-message">
                    <span class="eyebrow">THE AQUATIC COLLECTION</span>

                    <h1>
                        A world beneath
                        <em>the surface.</em>
                    </h1>

                    <p>
                        Manage your aquatic collection, products and
                        store operations from one place.
                    </p>
                </div>

                <span class="visual-footer">
                    MIZUMI AQUATICS &copy; 2026
                </span>
            </div>
        </section>


        <section class="login-panel">

            <div class="login-card">

                <div class="mobile-brand">
                    <span class="brand-name">MIZUMI</span>
                    <span class="brand-subtitle">AQUATICS</span>
                </div>

                <div class="login-heading">
                    <span class="eyebrow">ADMINISTRATION</span>

                    <h2>Welcome back.</h2>

                    <p>
                        Sign in to access your store dashboard.
                    </p>
                </div>

                <form id="adminLoginForm" autocomplete="on">

                    <div class="form-group">
                        <label for="email">Email address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="admin@example.com"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <div class="password-label">
                            <label for="password">Password</label>
                        </div>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>
                        </div>
                    </div>

                    <div
                        id="loginMessage"
                        class="login-message"
                        role="alert"
                        aria-live="polite"
                        hidden
                    ></div>

                    <button
                        type="submit"
                        id="loginButton"
                        class="login-button"
                    >
                        <span class="button-text">Sign in to dashboard</span>
                        <span class="button-arrow">→</span>
                    </button>

                </form>

                <div class="login-security">
                    <span class="security-dot"></span>
                    Secure administrator access
                </div>

            </div>

        </section>

    </main>

</body>
</html>
