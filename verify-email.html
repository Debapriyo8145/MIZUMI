<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Verify Email | MIZUMI Aquatics</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f6f3; color: #17211d; font-family: Arial, sans-serif; }
        main { width: min(100%, 480px); padding: 38px; background: #fff; border: 1px solid #e4ebe5; border-radius: 14px; text-align: center; box-shadow: 0 16px 45px rgba(20, 50, 35, .08); }
        h1 { margin: 0 0 12px; font-size: 26px; }
        p { line-height: 1.6; color: #5c6b63; }
        button, a { display: inline-block; margin-top: 14px; padding: 13px 22px; border: 0; border-radius: 7px; background: #123f35; color: #fff; text-decoration: none; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #status { min-height: 28px; }
    </style>
</head>
<body>
    <main>
        <h1>MIZUMI Aquatics</h1>
        <p id="status" role="status" aria-live="polite">Ready to verify your email address.</p>
        <button id="verifyButton" type="button">Verify email address</button>
        <p><a id="accountLink" href="account.html" hidden>Open my account</a></p>
    </main>
    <script>
        const API_BASE_URL = "http://localhost:5000/api/v1";
        const statusElement = document.getElementById("status");
        const verifyButton = document.getElementById("verifyButton");
        const accountLink = document.getElementById("accountLink");
        const token = new URLSearchParams(window.location.search).get("token");

        verifyButton.addEventListener("click", async () => {
            if (!token) {
                statusElement.textContent = "This verification link is invalid or incomplete. Request a new link from the account page.";
                verifyButton.hidden = true;
                return;
            }

            verifyButton.disabled = true;
            statusElement.textContent = "Verifying your email...";

            try {
                const response = await fetch(`${API_BASE_URL}/customer-auth/verify-email`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Accept: "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ token })
                });
                const result = await response.json();

                if (!response.ok) throw new Error(result.message || "Verification failed.");

                statusElement.textContent = result.message || "Email verified. Signing you in...";
                verifyButton.hidden = true;
                accountLink.hidden = false;
                window.setTimeout(() => {
                    window.location.replace("account.html");
                }, 1200);
            } catch (error) {
                statusElement.textContent = error.message;
                verifyButton.disabled = false;
            }
        });

        if (!token) {
            statusElement.textContent = "This verification link is invalid or incomplete. Request a new link from the account page.";
            verifyButton.hidden = true;
        }
    </script>
</body>
</html>
